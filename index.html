<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>App del Clima</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>

    <img src="img/clima.jpg"
         alt="Banner de la App del Clima"
         class="banner">

    <h1>🌤️ App del Clima</h1>

    <p>Consulta el clima de cualquier ciudad</p>

</header>


<main>

    <form id="formulario">

        <input
            type="text"
            id="inputCiudad"
            placeholder="Escribe una ciudad..."
            required
        >

        <button type="submit">
            🔍 Consultar
        </button>

    </form>

    <button id="ubicacion">
       Mi ubicación
    </button>


    
    <button id="tema">
        Cambiar tema
    </button>


    <div id="resultado" class="resultado"></div>

    <p id="estado"></p>

    
    <section>

        <h2> Historial</h2>

        <div id="historial"></div>

    </section>


    
    <section>

        <h2>Pronóstico de 5 días</h2>

        <div id="pronostico"></div>

    </section>

    <button id="whatsapp">
        Compartir en WhatsApp
    </button>

</main>


<footer>

    <p>
        © 2026 - App del Clima
    </p>

    <p>
        Datos de OpenWeatherMap
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
